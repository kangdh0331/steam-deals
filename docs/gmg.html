<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMG Finder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><span id="homeLink">🔑 GMG Finder</span></h1>
  <nav class="platform-nav">
    <a href="index.html">Steam</a>
    <a href="gog.html">GOG</a>
    <a href="gmg.html" class="active">GMG</a>
  </nav>
  <p class="platform-notice">
    ℹ️ Green Man Gaming(GMG)은 게임을 직접 서비스하는 플랫폼이 아니라 <strong>정품 CD 키를 판매하는 리셀러 사이트</strong>입니다.
    구매하면 키를 받아서 스팀 등 원래 플랫폼에 등록해 사용하는 방식이니 참고하세요.
  </p>
  <div class="controls">
    <input id="search" type="text" placeholder="게임/개발사/장르 검색... (세일 안 하는 게임도 검색됩니다)">
    <select id="genreFilter">
      <option value="">전체 장르</option>
    </select>
    <select id="publisherFilter">
      <option value="">전체 개발사/배급사</option>
    </select>
    <select id="sort">
      <option value="discount_desc">할인율 높은 순</option>
      <option value="price_asc">가격 낮은 순</option>
      <option value="price_desc">가격 높은 순</option>
      <option value="name_asc">이름순</option>
    </select>
    <input id="limitInput" type="number" min="1" step="1" placeholder="표시 개수 (전체)">
    <button id="refresh">새로고침</button>
  </div>
  <p id="meta" class="meta"></p>
</header>
<main id="grid" class="grid"></main>
<p id="empty" class="empty" hidden>표시할 게임이 없습니다.</p>
<script>
  window.SITE_CONFIG = {
    dataUrl: 'gmg_data.json',
    refreshUrl: '/api/gmg/refresh',
    reviewTier: () => 'mixed',
  };
</script>
<script src="app.js"></script>
</body>
</html>
